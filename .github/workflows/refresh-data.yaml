name: refresh-data

# ──────────────────────────────────────────────────────────────
# Trigger section
# ──────────────────────────────────────────────────────────────
on:
  schedule:
    # ───────────── 2025 ─────────────
    # CPI (AEDT)             National Accounts (AEDT)
    - cron: '40 0 29 1 *'   # 29 Jan 2025 – CPI Q4-2024
    - cron: '40 0  5 3 *'   # 05 Mar 2025 – Nat Acct Q4-2024

    # WPI (AEDT/AEST)
    - cron: '40 0 19 2 *'   # 19 Feb 2025 – WPI Q4-2024 (3rd Wed Feb, AEDT)
    - cron: '40 1 14 5 *'   # 14 May 2025 – WPI Q1-2025 (2nd Wed May, AEST)
    - cron: '40 1 13 8 *'   # 13 Aug 2025 – WPI Q2-2025 (2nd Wed Aug, AEST)
    - cron: '40 0 19 11 *'  # 19 Nov 2025 – WPI Q3-2025 (3rd Wed Nov, AEDT)

    # CPI (AEST)             National Accounts (AEST)
    - cron: '40 1 30 4 *'   # 30 Apr 2025 – CPI Q1-2025
    - cron: '40 1  4 6 *'   # 04 Jun 2025 – Nat Acct Q1-2025
    - cron: '40 1 30 7 *'   # 30 Jul 2025 – CPI Q2-2025
    - cron: '40 1  3 9 *'   # 03 Sep 2025 – Nat Acct Q2-2025

    # CPI (AEDT)             National Accounts (AEDT)
    - cron: '40 0 29 10 *'  # 29 Oct 2025 – CPI Q3-2025
    - cron: '40 0  3 12 *'  # 03 Dec 2025 – Nat Acct Q3-2025

    # ───────────── 2026 ─────────────
    # CPI (AEDT)             National Accounts (AEDT)
    - cron: '40 0 28 1 *'   # 28 Jan 2026 – CPI Q4-2025
    - cron: '40 0  4 3 *'   # 04 Mar 2026 – Nat Acct Q4-2025

    # WPI (AEDT/AEST)
    - cron: '40 0 18 2 *'   # 18 Feb 2026 – WPI Q4-2025 (3rd Wed Feb, AEDT)
    - cron: '40 1 13 5 *'   # 13 May 2026 – WPI Q1-2026 (2nd Wed May, AEST)
    - cron: '40 1 12 8 *'   # 12 Aug 2026 – WPI Q2-2026 (2nd Wed Aug, AEST)
    - cron: '40 0 18 11 *'  # 18 Nov 2026 – WPI Q3-2026 (3rd Wed Nov, AEDT)

    # CPI (AEST)             National Accounts (AEST)
    - cron: '40 1 29 4 *'   # 29 Apr 2026 – CPI Q1-2026
    - cron: '40 1  3 6 *'   # 03 Jun 2026 – Nat Acct Q1-2026
    - cron: '40 1 29 7 *'   # 29 Jul 2026 – CPI Q2-2026
    - cron: '40 1  2 9 *'   # 02 Sep 2026 – Nat Acct Q2-2026

    # CPI (AEDT)             National Accounts (AEDT)
    - cron: '40 0 28 10 *'  # 28 Oct 2026 – CPI Q3-2026
    - cron: '40 0  2 12 *'  # 02 Dec 2026 – Nat Acct Q3-2026

    # ───────────── 2027 ─────────────
    # CPI (AEDT)             National Accounts (AEDT)
    - cron: '40 0 27 1 *'   # 27 Jan 2027 – CPI Q4-2026
    - cron: '40 0  3 3 *'   # 03 Mar 2027 – Nat Acct Q4-2026

    # WPI (AEDT/AEST)
    - cron: '40 0 17 2 *'   # 17 Feb 2027 – WPI Q4-2026 (3rd Wed Feb, AEDT)
    - cron: '40 1 12 5 *'   # 12 May 2027 – WPI Q1-2027 (2nd Wed May, AEST)
    - cron: '40 1 11 8 *'   # 11 Aug 2027 – WPI Q2-2027 (2nd Wed Aug, AEST)
    - cron: '40 0 17 11 *'  # 17 Nov 2027 – WPI Q3-2027 (3rd Wed Nov, AEDT)

    # CPI (AEST)             National Accounts (AEST)
    - cron: '40 1 28 4 *'   # 28 Apr 2027 – CPI Q1-2027
    - cron: '40 1  2 6 *'   # 02 Jun 2027 – Nat Acct Q1-2027
    - cron: '40 1 28 7 *'   # 28 Jul 2027 – CPI Q2-2027
    - cron: '40 1  1 9 *'   # 01 Sep 2027 – Nat Acct Q2-2027

    # CPI (AEDT)             National Accounts (AEDT)
    - cron: '40 0 27 10 *'  # 27 Oct 2027 – CPI Q3-2027
    - cron: '40 0  1 12 *'  # 01 Dec 2027 – Nat Acct Q3-2027

    # Monthly vintage run for make_vintages.R
    - cron: '40 0 1 * *'    # 1st of each month

  # manual & PR triggers
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# ──────────────────────────────────────────────────────────────
# IMPORTANT: allow the auto-generated GITHUB_TOKEN to push
# ──────────────────────────────────────────────────────────────
permissions:
  contents: write        # <-- this line solves the 403 on git push

jobs:
  refresh-data:
    runs-on: macOS-latest
    env:
      R_KEEP_PKG_SOURCE: yes
      USE_MONTHLY_PARTIAL: "true"
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: true   # (default, but explicit never hurts)
          fetch-depth: 0              # allow rebasing onto the latest main

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # Pin to a stable release to avoid transient compiler download failures
          r-version: '4.4.2'

      - uses: r-lib/actions/setup-pandoc@v2

      # macOS-only XQuartz (needed for some plotting back-ends)
      - name: Install XQuartz on macOS
        if: runner.os == 'macOS'
        run: brew install xquartz --cask

      - name: Prepare git branch
        run: |
          git fetch origin main
          git checkout main
          git pull --rebase --autostash origin main

      - name: Install vctrs
        run: Rscript -e 'install.packages("vctrs")'

      - name: Install packages
        run: Rscript -e 'install.packages(c(
          "tidyverse","here","jsonlite","ggrepel","conflicted","tidyr","scales",
          "readabs","readrba","plotly","purrr","ggthemes","reshape2","zoo",
          "rstan","readr","lubridate","janitor","ggforce","viridisLite"))'

      - name: Get data
        run: Rscript -e 'source(here::here("R", "run_nairu.R"), echo = TRUE)'

      - name: Vintage NAIRU
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '40 0 1 * *')
        continue-on-error: true
        run: Rscript -e 'source("R/make_vintages.R", echo=TRUE)'

#      - name: State NAIRU
#        run: Rscript -e 'source(here::here("R", "state_nairu.r"), echo = TRUE)'


      - name: Make visuals
        run: Rscript -e 'source("R/plot_nairu.R", echo=TRUE)'

      - name: Make page
        run: Rscript -e 'source("R/write_html.R", echo=TRUE)'

      # Optional: inspect workspace tree in Actions log
      - name: Inspect workspace
        run: |
          echo "::group::Workspace tree"
          ls -R
          echo "::endgroup::"

      - name: Commit refreshed files
        run: |
          git config --global user.name  "igross"
          git config --global user.email "igross@users.noreply.github.com"

          # ── Nothing to do when the workspace is clean ────────────────────
          if git diff --quiet && git diff --cached --quiet; then
            echo "🟢 No changes to commit"
            exit 0
          fi

          # ── Stash changes before syncing with remote ─────────────────────
          git stash push -u
          STASH_NAME=$(git stash list | head -n1 | cut -d: -f1)

          # ── Rebase onto the latest remote main ───────────────────────────
          if ! git pull --rebase origin main; then
            echo "⚠️  git pull --rebase failed; aborting rebase and restoring stash"
            git rebase --abort || true
            git stash pop --index || true
            exit 1
          fi

          # ── Reapply stashed updates, preferring freshly generated outputs ─
          if [ -n "$STASH_NAME" ]; then
            if ! git stash pop --index "$STASH_NAME"; then
              echo "ℹ️  Conflicts while reapplying stash; preferring generated files"
              git checkout --theirs -- .
              git add -A
              git stash drop "$STASH_NAME" || true
            fi
          fi

          # ── Stage everything that might change ───────────────────────────
          if [ -d output ]; then
            git add -A output
          fi
          git add -A docs || true

          if git diff --cached --quiet; then
            echo "🟢 No changes to commit"
            exit 0
          fi

          git commit -m "Refreshing data $(date -u +'%Y-%m-%d')"
          git push
